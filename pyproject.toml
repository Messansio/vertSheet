[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vertsheet"
version = "1.0.0"
description = "Re-engrave piano sheet music to be read vertically, in pairs of left-hand / right-hand columns"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []
keywords = ["sheet music", "piano", "music engraving", "musicxml", "musescore"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Italian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]

[project.urls]
Homepage = "https://github.com/Messansio/vertSheet"
Releases = "https://github.com/Messansio/vertSheet/releases"
Changelog = "https://github.com/Messansio/vertSheet/blob/main/CHANGELOG.md"
Issues = "https://github.com/Messansio/vertSheet/issues"

[project.scripts]
vertsheet = "vertsheet.__main__:main"

[project.gui-scripts]
vertsheet-gui = "vertsheet.app:main"

[tool.setuptools]
packages = ["vertsheet"]
